---
- name: Validate ADCS RDP role inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Windows'
      - ad_rdp_adcs_target_profile in ['windows-legacy-2016', 'windows-standard-2022', 'windows-modern-2025']
      - ad_rdp_adcs_principals | length > 0
    fail_msg: Set a supported target profile and one or more existing domain principals.

- name: Grant declared principals RDP access on the ADCS host
  ansible.windows.win_powershell:
    parameters:
      Principals: "{{ ad_rdp_adcs_principals }}"
      GroupName: "{{ ad_rdp_adcs_group }}"
    script: |
      Import-Module ActiveDirectory -ErrorAction Stop
      foreach ($principal in $Principals) {
        $member = Get-ADObject -Identity $principal -ErrorAction Stop
        if (-not (Get-LocalGroupMember -Group $GroupName -ErrorAction Stop | Where-Object SID -eq $member.SID)) {
          Add-LocalGroupMember -Group $GroupName -Member $member.SamAccountName -ErrorAction Stop
          $Ansible.Changed = $true
        }
      }
