---
- name: Validate privilege-escalation entries
  ansible.builtin.assert:
    that:
      - item.user is defined
      - item.command is defined
      - item.command is match('^/')
    fail_msg: "Each entry requires a user and an absolute command path."
  loop: "{{ linux_gtfobins_privilege_escalation_entries }}"

- name: Configure privilege-escalation sudo rules
  ansible.builtin.template:
    src: privilege-escalation-sudoers.j2
    dest: /etc/sudoers.d/gtfobins-privilege-escalation
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  when: linux_gtfobins_privilege_escalation_entries | length > 0
