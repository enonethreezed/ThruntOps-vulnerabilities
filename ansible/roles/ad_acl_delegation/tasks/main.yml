---
- name: Validate ACL delegation inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Windows'
      - ad_acl_delegation_target_profile in ['windows-legacy-2016', 'windows-standard-2022', 'windows-modern-2025']
      - ad_acl_delegation_principal | length > 0
      - ad_acl_delegation_target_dn | length > 0
      - ad_acl_delegation_rights | length > 0
    fail_msg: Set an existing principal, target DN, and one or more AD rights.

- name: Delegate declared rights on the AD object
  ansible.windows.win_powershell:
    parameters:
      Principal: "{{ ad_acl_delegation_principal }}"
      TargetDn: "{{ ad_acl_delegation_target_dn }}"
      Rights: "{{ ad_acl_delegation_rights }}"
    script: |
      Import-Module ActiveDirectory -ErrorAction Stop
      $sid = (Get-ADObject -Identity $Principal -ErrorAction Stop).SID
      $acl = Get-Acl "AD:$TargetDn"
      foreach ($rightName in $Rights) {
        try { $right = [System.DirectoryServices.ActiveDirectoryRights]::$rightName } catch { throw "Unsupported AD right: $rightName" }
        if (-not ($acl.Access | Where-Object { $_.IdentityReference -eq $sid -and $_.ActiveDirectoryRights.HasFlag($right) })) { $acl.AddAccessRule((New-Object System.DirectoryServices.ActiveDirectoryAccessRule($sid, $right, 'Allow'))); $Ansible.Changed = $true }
      }
      if ($Ansible.Changed) { Set-Acl -Path "AD:$TargetDn" -AclObject $acl }
