---
- name: Validate LAPS delegation inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Windows'
      - ad_laps_read_delegation_target_profile in ['windows-legacy-2016', 'windows-standard-2022', 'windows-modern-2025']
      - ad_laps_read_delegation_principal | length > 0
      - ad_laps_read_delegation_target_dn | length > 0
    fail_msg: Set a supported profile, an existing principal, and a computer or OU distinguished name.

- name: Delegate read access to available LAPS password attributes
  ansible.windows.win_powershell:
    parameters:
      Principal: "{{ ad_laps_read_delegation_principal }}"
      TargetDn: "{{ ad_laps_read_delegation_target_dn }}"
    script: |
      Import-Module ActiveDirectory -ErrorAction Stop
      $identity = (Get-ADObject -Identity $Principal -ErrorAction Stop).SID
      $path = "AD:$TargetDn"
      $acl = Get-Acl $path
      $attributes = 'ms-Mcs-AdmPwd','msLAPS-Password','msLAPS-EncryptedPassword' | ForEach-Object { Get-ADObject -SearchBase (Get-ADRootDSE).schemaNamingContext -LDAPFilter "(lDAPDisplayName=$_)" -ErrorAction SilentlyContinue }
      if (-not $attributes) { throw 'No LAPS password schema attribute is present.' }
      foreach ($attribute in $attributes) {
        $rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($identity, [System.DirectoryServices.ActiveDirectoryRights]::ReadProperty, [System.Security.AccessControl.AccessControlType]::Allow, [guid]$attribute.SchemaIDGUID, [System.DirectoryServices.ActiveDirectorySecurityInheritance]::All)
        if (-not ($acl.Access | Where-Object { $_.IdentityReference -eq $identity -and $_.ObjectType -eq $rule.ObjectType -and $_.ActiveDirectoryRights.HasFlag([System.DirectoryServices.ActiveDirectoryRights]::ReadProperty) })) { $acl.AddAccessRule($rule); $Ansible.Changed = $true }
      }
      if ($Ansible.Changed) { Set-Acl -Path $path -AclObject $acl }
